<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>云端桌面</title>
  <style>
    body {
      margin: 0;
      background: #14171c;
      color: #eee;
      font: 15px system-ui;
    }
    header {
      display: flex;
      gap: 12px;
      padding: 12px;
      align-items: center;
    }
    button {
      padding: 8px 14px;
      border: 0;
      border-radius: 6px;
    }
    #screen {
      height: calc(100dvh - 64px);
    }
    #status {
      flex: 1;
    }
  </style>
  <header>
    <span id="status">正在连接云端桌面</span
    ><button id="toggle">云端文件</button><button id="control">接管操作</button
    ><button id="release" disabled>释放控制</button>
    <input
      id="text"
      type="password"
      autocomplete="off"
      placeholder="接管后输入文字"
      style="max-width: 12em"
    /><button id="sendText">发送文字</button>
  </header>
  <div id="files" hidden>
    <button id="up">上一级</button><input type="file" id="upload" /><span
      id="path"
    ></span>
    <div id="entries"></div>
    <pre id="preview" style="white-space: pre-wrap"></pre>
    <img id="image" style="max-width: 100%" />
  </div>
  <div id="screen"></div>
  <script type="module">
    import RFB from "./novnc/core/rfb.js";
    const params = new URLSearchParams(location.hash.slice(1)),
      launch = params.get("token"),
      bot = params.get("bot"),
      artifact = params.get("artifact");
    history.replaceState(null, "", location.pathname);
    let rfb, session, renew;
    const status = document.querySelector("#status"),
      control = document.querySelector("#control"),
      release = document.querySelector("#release");
    async function call(action, extra = {}) {
      const r = await fetch("./session", {
        method: "POST",
        headers: {
          Authorization: "Bearer " + launch,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ action, session_id: session, ...extra }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || "桌面操作失败");
      return d;
    }
    async function connect(action) {
      control.disabled = true;
      try {
        const previous = rfb;
        rfb = undefined;
        previous?.disconnect();
        if (session) {
          await call("release");
          session = undefined;
        }
        const d = await call(action);
        session = d.session_id;
        const url = new URL("../ws/remote-desktop", location.href);
        url.protocol = location.protocol === "https:" ? "wss:" : "ws:";
        url.searchParams.set("ticket", d.ticket);
        rfb = new RFB(document.querySelector("#screen"), url.href);
        rfb.scaleViewport = true;
        rfb.resizeSession = false;
        rfb.viewOnly = !session;
        rfb.addEventListener(
          "connect",
          () =>
            (status.textContent = session
              ? "你正在控制云端桌面，智能体操作已暂停"
              : "查看云端桌面"),
        );
        rfb.addEventListener("disconnect", () => {
          status.textContent = "连接已断开，可重新打开或点击接管";
        });
        release.disabled = !session;
        clearInterval(renew);
        if (session)
          renew = setInterval(
            () =>
              call("renew").catch((e) => {
                rfb?.disconnect();
                status.textContent = e.message;
              }),
            15000,
          );
      } catch (e) {
        status.textContent = e.message;
      } finally {
        control.disabled = false;
      }
    }
    let directory = "";
    const files = document.querySelector("#files"),
      screen = document.querySelector("#screen"),
      entries = document.querySelector("#entries");
    async function fileRequest(path, options = {}) {
      const url = new URL("./file", location.href);
      url.searchParams.set("bot", bot);
      url.searchParams.set("path", path);
      if (options.list) url.searchParams.set("list", "1");
      const r = await fetch(url, {
        ...options,
        headers: { Authorization: "Bearer " + launch, ...options.headers },
      });
      if (!r.ok) {
        const data = await r.json().catch(() => ({}));
        throw new Error(data.detail || "文件操作失败");
      }
      return r;
    }
    async function list(path) {
      directory = path;
      document.querySelector("#path").textContent = path || "/";
      entries.replaceChildren();
      document.querySelector("#preview").textContent = "";
      document.querySelector("#image").removeAttribute("src");
      const data = await (await fileRequest(path, { list: true })).json();
      for (const e of data.entries) {
        const button = document.createElement("button");
        button.textContent = (e.type === "dir" ? "📁 " : "📄 ") + e.name;
        button.onclick = async () => {
          try {
            const next = (directory ? directory + "/" : "") + e.name;
            if (e.type === "dir") return await list(next);
            const blob = await (await fileRequest(next)).blob();
            const url = URL.createObjectURL(blob);
            if (/\.(png|jpe?g|webp|gif)$/i.test(e.name))
              document.querySelector("#image").src = url;
            else if (
              blob.size < 1000000 &&
              /\.(txt|md|json|csv|log|html|js|py|yaml|yml)$/i.test(e.name)
            )
              document.querySelector("#preview").textContent =
                await blob.text();
            const download = document.createElement("a");
            download.href = url;
            download.download = e.name;
            download.textContent = "下载 " + e.name;
            entries.append(download);
            setTimeout(() => URL.revokeObjectURL(url), 300000);
          } catch (e) {
            status.textContent = e.message;
          }
        };
        entries.append(button);
      }
    }
    document.querySelector("#toggle").onclick = () => {
      files.hidden = !files.hidden;
      screen.hidden = !files.hidden;
      if (!files.hidden) {
        if (!bot) {
          status.textContent = "请从 Bot 页面打开云端文件";
          return;
        }
        list("").catch((e) => (status.textContent = e.message));
      }
    };
    document.querySelector("#up").onclick = () =>
      list(directory.split("/").slice(0, -1).join("/")).catch(
        (e) => (status.textContent = e.message),
      );
    document.querySelector("#upload").onchange = async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      if (file.size > 100 * 1024 * 1024) {
        status.textContent = "单文件最多 100MiB";
        return;
      }
      try {
        const name = (directory ? directory + "/" : "") + file.name;
        if (!confirm("上传 " + name + "？同名文件会被覆盖。")) return;
        await fileRequest(name, {
          method: "POST",
          headers: { "Content-Type": "application/octet-stream" },
          body: file,
        });
        await list(directory);
      } catch (e) {
        status.textContent = e.message;
      }
      event.target.value = "";
    };
    document.querySelector("#sendText").onclick = async () => {
      try {
        if (!session) throw new Error("请先接管操作");
        await call("text", { text: document.querySelector("#text").value });
        document.querySelector("#text").value = "";
        status.textContent = "文字已发送";
      } catch (e) {
        status.textContent = e.message;
      }
    };
    control.onclick = () => connect("acquire");
    release.onclick = () => connect("view");
    addEventListener("pagehide", () => {
      clearInterval(renew);
      rfb?.disconnect();
    });
    if (artifact) {
      files.hidden = false;
      screen.hidden = true;
      control.hidden = true;
      document.querySelector("#text").hidden = true;
      document.querySelector("#sendText").hidden = true;
      release.hidden = true;
      document.querySelector("#toggle").hidden = true;
      document.querySelector("#up").hidden = true;
      document.querySelector("#upload").hidden = true;
      fileRequest(artifact)
        .then((r) => r.blob())
        .then(async (blob) => {
          const url = URL.createObjectURL(blob),
            name = artifact.split("/").at(-1);
          status.textContent = name;
          if (/\.(png|jpe?g|webp|gif)$/i.test(name))
            document.querySelector("#image").src = url;
          else if (
            blob.size < 1000000 &&
            /\.(txt|md|json|csv|log|html|js|py|yaml|yml)$/i.test(name)
          )
            document.querySelector("#preview").textContent = await blob.text();
          const a = document.createElement("a");
          a.href = url;
          a.download = name;
          a.textContent = "下载 " + name;
          entries.append(a);
        })
        .catch((e) => (status.textContent = e.message));
    } else connect("view");
  </script>
</html>
