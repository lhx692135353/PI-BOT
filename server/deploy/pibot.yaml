# Pi Bot server Kubernetes 示例；请按实际集群调整入口、存储、镜像和拉取凭据。
# ClusterIP + Traefik IngressRoute，入口 https://bot.example.com/pibot
# 管理后台：https://bot.example.com/pibot/admin/
# 镜像由 GitHub Actions 推到 registry.cn-beijing.aliyuncs.com/liuhx/pi-bot-server:latest
# 应用前创建 namespace：kubectl create namespace pibot
# 应用前：
#   1. 修改下方 Secret 中的口令、JWT（至少 32 位）和 Runner token（至少 32 位）
#   2. 生成模型密钥加密文件并创建 Secret：
#        node --import tsx server/scripts/vault-key.ts "$PWD/vault.json"
#        kubectl -n pibot create secret generic pibot-vault --from-file=vault.json
#   3. 替换镜像地址和拉取 Secret（示例名 liuhx-aliyun-registry），配置实际存储与 Ingress
# API 必须单副本：Mac 的 WebSocket 连接和资料库 RPC 终止在 API 进程内。
apiVersion: v1
kind: Secret
metadata:
  name: pibot
  namespace: pibot
type: Opaque
stringData:
  POSTGRES_USER: pibot
  POSTGRES_PASSWORD: change-me-db
  POSTGRES_DB: pibot
  PI_BOT_DATABASE_URL: postgresql://pibot:change-me-db@pibot-postgres:5432/pibot
  PI_BOT_ADMIN_USERNAME: admin
  PI_BOT_ADMIN_PASSWORD: change-me-admin-password
  PI_BOT_JWT_SECRET: change-me-to-a-long-random-string-32chars
  PI_BOT_RUNNER_TOKEN: change-me-to-a-random-runner-token-32chars
  PI_BOT_RUNNER_URL: http://pibot-runner:8001
  PI_BOT_INTERNAL_URL: http://pibot:8000
  PI_BOT_VAULT_FILE: /run/secrets/pibot/vault.json
  PI_BOT_TAVILY_API_KEY: ""
  # Enable in this shared Secret after configuring the Worker-only pibot-langfuse Secret.
  LANGFUSE_TRACING_ENABLED: "false"
  PI_BOT_REMOTE_BACKEND: none
  # KubeVirt: mount a projected service account token and CA in the API pod.
  # PI_BOT_K8S_SERVER: https://kubernetes.default.svc
  # PI_BOT_K8S_TOKEN_FILE: /var/run/secrets/kubernetes.io/serviceaccount/token
  # PI_BOT_K8S_CA_FILE: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  # PI_BOT_K8S_NAMESPACE: pibot
  # PI_BOT_KUBEVIRT_IMAGE_URL: https://images.example.com/pibot-ubuntu-24.04.qcow2
---
apiVersion: v1
kind: Service
metadata:
  name: pibot-postgres
  namespace: pibot
spec:
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    app: pibot-postgres
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pibot-postgres
  namespace: pibot
  labels:
    app: pibot-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pibot-postgres
  template:
    metadata:
      labels:
        app: pibot-postgres
    spec:
      containers:
        - name: postgres
          image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: pibot, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: pibot, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: pibot, key: POSTGRES_DB } }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pibot", "-d", "pibot"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: "500m"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          hostPath:
            path: /data/pgsql-pibot
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: pibot
  namespace: pibot
spec:
  ports:
    - name: http
      port: 8000
      protocol: TCP
      targetPort: 8000
  selector:
    app: pibot
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pibot
  namespace: pibot
  labels:
    app: pibot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pibot
  template:
    metadata:
      labels:
        app: pibot
    spec:
      imagePullSecrets:
        - name: liuhx-aliyun-registry
      initContainers:
        - name: wait-postgres
          image: registry.cn-beijing.aliyuncs.com/liuhx/pi-bot-server:latest
          imagePullPolicy: Always
          command: ["node", "server/scripts/wait.mjs", "tcp", "pibot-postgres:5432"]
          resources:
            limits: { cpu: "500m", memory: 512Mi }
            requests: { cpu: "100m", memory: 128Mi }
      containers:
        - name: pibot
          image: registry.cn-beijing.aliyuncs.com/liuhx/pi-bot-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: pibot
          env:
            - name: LANGFUSE_TRACING_ENABLED
              valueFrom:
                secretKeyRef: { name: pibot, key: LANGFUSE_TRACING_ENABLED }
          readinessProbe:
            httpGet: { path: /health, port: 8000, scheme: HTTP }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000, scheme: HTTP }
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            limits: { cpu: "2", memory: 2Gi }
            requests: { cpu: "500m", memory: 512Mi }
          volumeMounts:
            - { name: vault, mountPath: /run/secrets/pibot, readOnly: true }
      volumes:
        - name: vault
          secret:
            secretName: pibot-vault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pibot-worker
  namespace: pibot
  labels:
    app: pibot-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pibot-worker
  template:
    metadata:
      labels:
        app: pibot-worker
    spec:
      imagePullSecrets:
        - name: liuhx-aliyun-registry
      initContainers:
        - name: wait-api
          image: registry.cn-beijing.aliyuncs.com/liuhx/pi-bot-server:latest
          imagePullPolicy: Always
          command: ["node", "server/scripts/wait.mjs", "http", "http://pibot:8000/health"]
          resources:
            limits: { cpu: "500m", memory: 512Mi }
            requests: { cpu: "100m", memory: 128Mi }
      containers:
        - name: pibot-worker
          image: registry.cn-beijing.aliyuncs.com/liuhx/pi-bot-server:latest
          imagePullPolicy: Always
          command: ["node", "server/dist/worker.mjs"]
          envFrom:
            - secretRef:
                name: pibot
            - secretRef:
                name: pibot-langfuse
                optional: true
          env:
            # Override any accidental switch in the credential Secret with the shared switch.
            - name: LANGFUSE_TRACING_ENABLED
              valueFrom:
                secretKeyRef: { name: pibot, key: LANGFUSE_TRACING_ENABLED }
          resources:
            limits: { cpu: "1", memory: 1Gi }
            requests: { cpu: "200m", memory: 256Mi }
          volumeMounts:
            - { name: vault, mountPath: /run/secrets/pibot, readOnly: true }
      volumes:
        - name: vault
          secret:
            secretName: pibot-vault
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: pibot-strip-prefix
  namespace: pibot
spec:
  stripPrefix:
    prefixes:
      - /pibot
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  annotations:
    kubernetes.io/ingress.class: traefik-internet
  name: pibot-https
  namespace: pibot
spec:
  entryPoints:
    - https
  routes:
    - kind: Rule
      match: Host(`bot.example.com`) && PathPrefix(`/pibot`)
      middlewares:
        - name: pibot-strip-prefix
      services:
        - kind: Service
          name: pibot
          namespace: pibot
          port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: pibot-runner
  namespace: pibot
spec:
  selector:
    app: pibot-runner
  ports:
    - name: runner
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pibot-runner
  namespace: pibot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pibot-runner
  template:
    metadata:
      labels:
        app: pibot-runner
    spec:
      imagePullSecrets:
        - name: liuhx-aliyun-registry
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: runner
          image: registry.cn-beijing.aliyuncs.com/liuhx/pi-bot-server:latest
          imagePullPolicy: Always
          command: ["node", "server/dist/runner.mjs"]
          # 不要 envFrom: pibot —— Runner 不应拿到数据库、JWT 或模型密钥。
          env:
            - name: PI_BOT_RUNNER_TOKEN
              valueFrom: { secretKeyRef: { name: pibot, key: PI_BOT_RUNNER_TOKEN } }
            - name: PI_BOT_RUNNER_DATA_DIR
              value: /data
          ports:
            - containerPort: 8001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
