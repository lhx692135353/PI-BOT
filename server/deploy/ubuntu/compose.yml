name: pi-bot

x-app: &app
  image: ${PI_BOT_IMAGE:-${PI_BOT_IMAGE_REPOSITORY}:latest}
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-env: &env
  PI_BOT_REMOTE_BACKEND: ${PI_BOT_REMOTE_BACKEND:-none}
  PI_BOT_K8S_SERVER: ${PI_BOT_K8S_SERVER:-}
  PI_BOT_K8S_TOKEN_FILE: ${PI_BOT_K8S_TOKEN_FILE:-}
  PI_BOT_K8S_CA_FILE: ${PI_BOT_K8S_CA_FILE:-}
  PI_BOT_K8S_NAMESPACE: ${PI_BOT_K8S_NAMESPACE:-pibot}
  PI_BOT_KUBEVIRT_IMAGE_URL: ${PI_BOT_KUBEVIRT_IMAGE_URL:-}
  PI_BOT_KUBEVIRT_STORAGE_CLASS: ${PI_BOT_KUBEVIRT_STORAGE_CLASS:-}
  PI_BOT_KUBEVIRT_CPU: ${PI_BOT_KUBEVIRT_CPU:-2}
  PI_BOT_KUBEVIRT_MEMORY: ${PI_BOT_KUBEVIRT_MEMORY:-4Gi}
  PI_BOT_KUBEVIRT_DISK: ${PI_BOT_KUBEVIRT_DISK:-40Gi}
  LANGFUSE_TRACING_ENABLED: ${LANGFUSE_TRACING_ENABLED:-false}
  NODE_ENV: production
  NODE_OPTIONS: --max-old-space-size=192
  PI_BOT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  PI_BOT_ADMIN_USERNAME: ${PI_BOT_ADMIN_USERNAME}
  PI_BOT_ADMIN_PASSWORD: ${PI_BOT_ADMIN_PASSWORD}
  PI_BOT_JWT_SECRET: ${PI_BOT_JWT_SECRET}
  PI_BOT_VAULT_FILE: /run/secrets/vault.json
  PI_BOT_TAVILY_API_KEY: ${PI_BOT_TAVILY_API_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=60]
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 256m
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    <<: *app
    environment: *env
    ports: ["${PI_BOT_BIND_ADDRESS:-0.0.0.0}:${PI_BOT_HTTP_PORT:-8000}:8000"]
    volumes: [./vault.json:/run/secrets/vault.json:ro]
    mem_limit: 320m
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
  worker:
    <<: *app
    command: [node, server/dist/worker.mjs]
    environment:
      <<: *env
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-production}
      PI_BOT_INTERNAL_URL: http://api:8000
      PI_BOT_RUNNER_URL: http://runner:8001
      PI_BOT_RUNNER_TOKEN: ${PI_BOT_RUNNER_TOKEN}
      PI_BOT_WORKER_CONCURRENCY: ${PI_BOT_WORKER_CONCURRENCY:-2}
    volumes: [./vault.json:/run/secrets/vault.json:ro]
    mem_limit: 256m
    stop_grace_period: 90s
    depends_on:
      api: {condition: service_healthy}
      runner: {condition: service_healthy}
  runner:
    <<: *app
    command: [node, server/dist/runner.mjs]
    environment:
      NODE_OPTIONS: --max-old-space-size=256
      PI_BOT_RUNNER_TOKEN: ${PI_BOT_RUNNER_TOKEN}
      PI_BOT_RUNNER_DATA_DIR: /data
    volumes: [runnerdata:/data]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 384m
    cpus: 1
    stop_grace_period: 90s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  runnerdata:
