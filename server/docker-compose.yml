# 本地完整栈：Postgres + API（含 /admin 管理后台）+ Worker + Runner。
# 先生成模型密钥加密文件：node --import tsx server/scripts/vault-key.ts "$PWD/server/vault.json"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pibot
      POSTGRES_PASSWORD: pibot
      POSTGRES_DB: pibot
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pibot -d pibot"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment: &server-env
      PI_BOT_REMOTE_BACKEND: ${PI_BOT_REMOTE_BACKEND:-none}
      PI_BOT_K8S_SERVER: ${PI_BOT_K8S_SERVER:-}
      PI_BOT_K8S_TOKEN_FILE: ${PI_BOT_K8S_TOKEN_FILE:-}
      PI_BOT_K8S_CA_FILE: ${PI_BOT_K8S_CA_FILE:-}
      PI_BOT_K8S_NAMESPACE: ${PI_BOT_K8S_NAMESPACE:-pibot}
      PI_BOT_KUBEVIRT_IMAGE_URL: ${PI_BOT_KUBEVIRT_IMAGE_URL:-}
      PI_BOT_KUBEVIRT_STORAGE_CLASS: ${PI_BOT_KUBEVIRT_STORAGE_CLASS:-}
      PI_BOT_KUBEVIRT_CPU: ${PI_BOT_KUBEVIRT_CPU:-2}
      PI_BOT_KUBEVIRT_MEMORY: ${PI_BOT_KUBEVIRT_MEMORY:-4Gi}
      PI_BOT_KUBEVIRT_DISK: ${PI_BOT_KUBEVIRT_DISK:-40Gi}
      LANGFUSE_TRACING_ENABLED: ${LANGFUSE_TRACING_ENABLED:-false}
      PI_BOT_DATABASE_URL: postgresql://pibot:pibot@postgres:5432/pibot
      PI_BOT_ADMIN_USERNAME: ${PI_BOT_ADMIN_USERNAME:-admin}
      PI_BOT_ADMIN_PASSWORD: ${PI_BOT_ADMIN_PASSWORD:?set PI_BOT_ADMIN_PASSWORD}
      PI_BOT_JWT_SECRET: ${PI_BOT_JWT_SECRET:?set PI_BOT_JWT_SECRET (>= 32 chars)}
      PI_BOT_VAULT_FILE: /run/secrets/pibot-vault.json
      PI_BOT_APPROVAL_TTL_SECONDS: ${PI_BOT_APPROVAL_TTL_SECONDS:-900}
      PI_BOT_TAVILY_API_KEY: ${PI_BOT_TAVILY_API_KEY:-}
      PI_BOT_AUTOMATION_ROUND_SECONDS: ${PI_BOT_AUTOMATION_ROUND_SECONDS:-300}
      PI_BOT_AUTOMATION_MODEL_CALLS: ${PI_BOT_AUTOMATION_MODEL_CALLS:-20}
      PI_BOT_AUTOMATION_DAILY_ROUNDS: ${PI_BOT_AUTOMATION_DAILY_ROUNDS:-96}
      PI_BOT_AUTOMATION_PATROL_DAILY_ROUNDS: ${PI_BOT_AUTOMATION_PATROL_DAILY_ROUNDS:-8}
    volumes: ["./vault.json:/run/secrets/pibot-vault.json:ro"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
  worker:
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: ["node", "server/dist/worker.mjs"]
    environment:
      <<: *server-env
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-production}
      PI_BOT_INTERNAL_URL: http://api:8000
      PI_BOT_RUNNER_URL: http://runner:8001
      PI_BOT_RUNNER_TOKEN: ${PI_BOT_RUNNER_TOKEN:?set a random runner token of at least 32 characters}
    volumes: ["./vault.json:/run/secrets/pibot-vault.json:ro"]
    depends_on:
      api: {condition: service_healthy}
      runner: {condition: service_healthy}
    restart: unless-stopped
  runner:
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: ["node", "server/dist/runner.mjs"]
    environment:
      PI_BOT_RUNNER_TOKEN: ${PI_BOT_RUNNER_TOKEN:?set PI_BOT_RUNNER_TOKEN}
      PI_BOT_RUNNER_DATA_DIR: /data
    volumes: ["runnerdata:/data"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  runnerdata:
