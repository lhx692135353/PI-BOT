name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/windows-client]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Project checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pibot
          POSTGRES_PASSWORD: pibot
          POSTGRES_DB: pibot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pibot -d pibot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Ubuntu deployment scripts
        run: |
          bash -n server/deploy/ubuntu/install.sh server/deploy/ubuntu/deploy.sh
          python3 -m unittest discover -s server/deploy/ubuntu -p 'test_*.py' -v
      - run: npm run typecheck
      - name: Resolve desktop Electron version
        id: electron
        run: |
          node -e 'const { createRequire } = require("node:module"); const fromDesktop = createRequire(process.cwd() + "/desktop/package.json"); console.log("version=" + fromDesktop("electron/package.json").version)' >> "$GITHUB_OUTPUT"
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pibot-electron-cache
          key: electron-download-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}
      - name: Install and verify desktop Electron for mounted UI regression tests
        env:
          electron_config_cache: ${{ runner.temp }}/pibot-electron-cache
        run: bash .github/scripts/install-ci-electron.sh
      - name: Install Chromium for browser integration tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pibot-playwright
        run: bash .github/scripts/install-ci-chromium.sh
      - run: xvfb-run --auto-servernum npm test
        env:
          PI_BOT_TEST_DATABASE_URL: postgresql://pibot:pibot@127.0.0.1:5432/pibot_test
          PI_BOT_TEST_BROWSER: chromium
          PI_BOT_TEST_BROWSER_HANDOFF: '1'
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pibot-playwright
      - run: npm run build
