name: Desktop platforms
# 只在桌面端、它打进安装包的共享包，或本工作流有改动时构建并上传。
# 桌面 beta 通过 workflow_call 调用，推送标签时不受下面的路径限制。
on:
  pull_request:
    paths:
      - "desktop/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main, feat/windows-client]
    paths:
      - "desktop/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build --workspace=pi-bot-desktop
      - run: node --import tsx --test desktop/tests/platform.test.ts desktop/tests/library.test.ts desktop/tests/cloud.test.ts desktop/tests/windows.test.ts
      - if: runner.os == 'Linux' || runner.os == 'macOS'
        run: npm rebuild electron
      - if: runner.os == 'Linux'
        run: npm run pack:linux --workspace=pi-bot-desktop
      - if: runner.os == 'macOS'
        run: npm run pack:mac --workspace=pi-bot-desktop
      - if: runner.os == 'Linux'
        name: Smoke test packaged service
        env:
          PI_BOT_DATA_DIR: ${{ runner.temp }}/pi-bot-smoke
          PI_BOT_LIBRARY_ROOT: ${{ runner.temp }}/pi-bot-library
        run: |
          desktop/out/linux/pi-bot-service-linux-x64/pi-bot --help
          mkdir -p "$RUNNER_TEMP/pi bot bin"
          ln -s "$PWD/desktop/out/linux/pi-bot-service-linux-x64/pi-bot" "$RUNNER_TEMP/pi bot bin/pi-bot"
          "$RUNNER_TEMP/pi bot bin/pi-bot" --help
          desktop/out/linux/pi-bot-service-linux-x64/pi-bot serve &
          service_pid=$!
          trap 'kill "$service_pid"; wait "$service_pid" || true' EXIT
          "$RUNNER_TEMP/pi bot bin/pi-bot" status
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pi-bot-linux-x64
          path: desktop/out/linux/*.tar.gz
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: pi-bot-macos-arm64-UNSIGNED-TEST
          if-no-files-found: error
          path: desktop/apps/desktop/out/make/*.dmg
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PI_BOT_WINDOWS_HELPER: ${{ github.workspace }}\desktop\native\dist\pi-bot-windows.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm rebuild electron
      - name: Typecheck desktop and platform callers
        run: |
          npx tsc --noEmit
          npm run typecheck --workspace=pi-bot-desktop
          npm run typecheck --workspace=@pi-bot/admin
      - name: Build, native security tests and unsigned x64 installer
        run: npm run pack:win --workspace=pi-bot-desktop
      - name: File-tool regression on native Windows
        run: node --import tsx --test --test-timeout=120000 desktop/tests/library.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: pi-bot-windows-x64-UNSIGNED-TEST
          if-no-files-found: error
          path: |
            .w/make/**/*.exe
            .w/make/**/*.zip
            .w/make/SHA256SUMS.txt
