# 服务端、管理后台与共享包变更时，先验证再构建镜像。
# 仓库：registry.cn-beijing.aliyuncs.com/liuhx/pi-bot-server
# 在 GitHub 仓库 Settings → Secrets 中配置：
#   ALIYUN_REGISTRY_USER      控制台登录用户名
#   ALIYUN_REGISTRY_PASSWORD  访问凭证里的固定密码（不是登录密码）
name: server image

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "admin/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Reuse the PR checks, including Electron installation and the Xvfb display.
    # Keeping a second test job here previously missed the UI runtime setup.
    uses: ./.github/workflows/ci.yml
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            registry.cn-beijing.aliyuncs.com/liuhx/pi-bot-server:latest
            registry.cn-beijing.aliyuncs.com/liuhx/pi-bot-server:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
